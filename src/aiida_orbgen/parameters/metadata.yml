yeesuan:
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_wallclock_seconds: 7200
    max_memory_kb: 189440000
    queue_name: "q_ysuan"
    withmpi: true

# Same queue, but scheduled only on the 384 GB nodes and with a longer walltime.
# Needed by LCAO runs on a large *primitive* NSW basis: the two-center tables grow
# with (number of radial functions)^2, so e.g. U at r_cut 12 au with ecutjy 250 Ry
# (59s58p58d57f57g, 578 functions for the dimer) is killed by the cgroup OOM of the
# standard 185 GB request.  `scan_status.py` reports which scan points need it.
yeesuan_bigmem:
  options:
    resources:
      num_machines: 1
      num_mpiprocs_per_machine: 56
      tot_num_mpiprocs: 56
    max_wallclock_seconds: 43200
    max_memory_kb: 366000000
    queue_name: "q_ysuan"
    withmpi: true
